# 轻量服务器本地测试用 Elasticsearch（低内存 + 认证）
# 在轻量服务器执行：
#   cd /opt/rag-lab/es-test
#   cp .env.es-test.example .env.es-test   # 编辑密码，与本地 .env 一致
#   docker compose -f docker-compose.es-test.yml --env-file .env.es-test up -d
#
# 本地开发：ES_HOSTS=http://<LIGHT_SERVER_PUBLIC_IP>:9200
#           ES_USERNAME=elastic  ES_PASSWORD=<与 .env.es-test 一致>
# 生产后端仍走 ECS ES，勿改 /opt/rag-lab/app/.env.app

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: rag-test-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required}
      ES_JAVA_OPTS: "-Xms384m -Xmx384m"
    volumes:
      - es_test_data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

volumes:
  es_test_data:
