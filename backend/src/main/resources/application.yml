spring:
  application:
    name: ai-rag-lab-platform
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

rag:
  app:
    name: ai-rag-lab-platform
    version: V8
  storage:
    path: ./data/uploads
  document:
    chunk-size: 800
    chunk-overlap: 100
  # V2.5：默认 mock；dev 环境见 application-dev.yml，支持 mock / qwen / deepseek
  embedding:
    provider: mock
    model: mock-embedding
    dimension: 384
    api-key: ""
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chat:
    provider: mock
    model: mock-chat
    api-key: ""
    base-url: https://api.deepseek.com
  context:
    max-chunks: 2
    min-score: 0.45
    max-score-gap: 0.35
  elasticsearch:
    hosts: ${ES_HOSTS:http://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:}
    index: rag_document_chunk
